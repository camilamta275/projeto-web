name: Regressao completa

on:
  workflow_dispatch:

jobs:
  regressao-completa:
    name: Regressao completa
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Instalar dependencias do frontend
        run: npm install --prefix frontend

      - name: Executar testes automatizados existentes (Jest)
        run: npm test --prefix frontend -- --runInBand

      # Completar com a equipe: adicionar steps de testes unitarios e de API.
      # A suite Jest existente e de aceitacao (ATDD), nao unitarios.
      # Completar com a equipe: adicionar o step E2E com os fluxos Cypress smoke.