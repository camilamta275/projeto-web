name: Regressao completa

on:
  workflow_dispatch:

jobs:
  testes-jest:
    name: Testes automatizados com Jest
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Instalar dependencias do frontend
        run: npm install --prefix frontend

      - name: Executar testes unitarios
        run: npm test --prefix frontend -- --runInBand src/tests/unit

      - name: Executar testes de API
        run: npm test --prefix frontend -- --runInBand src/tests/api

      - name: Executar testes de aceitacao
        run: npm test --prefix frontend -- --runInBand src/tests/acceptance
